
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Data Entry</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 400px; margin: auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background: #3ecf8e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #34b279; }
    </style>
</head>
<body>

<div class="container">
    <h2>Gym Log Entry</h2>
    <form id="gymForm">
        <div class="form-group">
            <label for="gymCode">Gym Test Code</label>
            <input type="text" id="gymCode" required placeholder="e.g. MGM-101">
        </div>
        
        <div class="form-group">
            <label for="category">Category</label>
            <input type="text" id="category" required placeholder="e.g. Cardio, Weights">
        </div>
        
        <div class="form-group">
            <label for="status">Status</label>
            <select id="status">
                <option value="Normal">Normal</option>
                <option value="Not Normal">Not Normal</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="comments">Comments</label>
            <textarea id="comments" rows="3" placeholder="Add any details..."></textarea>
        </div>
        
        <button type="submit" id="submitBtn">Submit Data</button>
    </form>
</div>

<script>
    // Universal fail-safe tracker: if the page crashes, this will force an error alert out
    window.onerror = function (message, url, line) {
        alert("System Crash Error: " + message + " on line " + line);
        return false;
    };

    const SUPABASE_URL = 'https://sgqhyawfunxuiggmharb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_jC9bsUEnb9uyA24P5oalvw_Ik8MwB6q';
    
    // Cleaner initialization fallback
    const supabaseClient = window.supabase ? window.supabase : supabase;
    const client = supabaseClient.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('gymForm').addEventListener('submit', async (e) => {
        e.preventDefault(); 
        
        // Visual indicator that button was tapped
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Sending Data...";
        btn.style.background = "#ffa500";

        const gymCode = document.getElementById('gymCode').value;
        const category = document.getElementById('category').value;
        const status = document.getElementById('status').value;
        const comments = document.getElementById('comments').value;

        try {
            const { data, error } = await client
                .from('Test_records') 
                .insert([
                    { 
                        'Test_code': gymCode, 
                        'Category': category, 
                        'status': status, 
                        'Comments': comments 
                    }
                ]);

            if (error) {
                alert('Database Error: ' + error.message);
            } else {
                alert('Data saved perfectly!');
                document.getElementById('gymForm').reset(); 
            }
        } catch (err) {
            alert('JavaScript Processing Error: ' + err.message);
        } finally {
            // Reset button style
            btn.innerText = "Submit Data";
            btn.style.background = "#3ecf8e";
        }
    });
</script>

</body>
</html>
