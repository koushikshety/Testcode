<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGM Test Records Master Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --primary: #3ecf8e;
            --primary-hover: #34b279;
            --bg: #f4f4f9;
            --dark: #2c3e50;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--dark); }
        
        /* Navigation Bar */
        nav { background-color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; gap: 15px; position: sticky; top: 0; z-index: 100; }
        nav button { padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; background: #e0e0e0; color: var(--dark); }
        nav button.active { background-color: var(--primary); color: white; }
        
        /* Main Container */
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Card Layouts */
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--dark); border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        
        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .submit-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .submit-btn:hover { background: var(--primary-hover); }

        /* Search Controls */
        .search-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .search-bar { font-size: 15px; padding: 12px; border: 2px solid #ddd; border-radius: 6px; }
        .search-bar:focus { border-color: var(--primary); outline: none; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .filter-badge { padding: 8px 16px; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; user-select: none; }
        .filter-badge.selected { background: var(--dark); color: white; }

        /* Table Layout */
        .table-responsive { overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #fafafa; font-weight: bold; color: #666; }
        tr:hover { background-color: #fafdff; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-normal { background-color: #e6f9f0; color: #1f925b; }
        .status-notnormal { background-color: #feecee; color: #eb3b5a; }
        
        .meta-info { font-size: 13px; color: #666; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>

<nav>
    <button id="nav-dashboard" class="active" onclick="switchPage('dashboard')">📊 All Test Records</button>
    <button id="nav-add" onclick="switchPage('add')">➕ Add New Test Code</button>
    <button id="nav-dropbox" onclick="switchPage('dropbox')">📥 DropBox Filter Hub</button>
</nav>

<div class="container">

    <div id="page-dashboard" class="page active">
        <div class="card">
            <h2>MGM Master Database Inventory</h2>
            <div class="search-container">
                <input type="text" id="db-search" class="search-bar" oninput="filterData('dashboard')" placeholder="Search multiple Test Codes (e.g. MGM005, RS042, MGM001&MGM002)...">
                <div class="meta-info" id="db-count">Loading entries from system database...</div>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Test Code</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-dashboard">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="page-add" class="page">
        <div class="card" style="max-width: 500px; margin: auto;">
            <h2>Create New Test Registry</h2>
            <form id="mgmForm">
                <div class="form-group">
                    <label for="testCode">Test Code</label>
                    <input type="text" id="testCode" required oninput="this.value = this.value.toUpperCase();" placeholder="e.g. MGM042 or RS042">
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" required oninput="this.value = this.value.toUpperCase();" placeholder="e.g. NGS, HISTO, FISH, IHC">
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" onchange="this.value = this.value.toUpperCase();">
                        <option value="NORMAL">NORMAL</option>
                        <option value="NOT NORMAL">NOT NORMAL</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="comments">Comments (Keeps Normal Case Text)</label>
                    <textarea id="comments" rows="4" placeholder="Add custom diagnostics notes or descriptions here..."></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn">Register Code Data</button>
            </form>
        </div>
    </div>

    <div id="page-dropbox" class="page">
        <div class="card">
            <h2>DropBox Advanced Category Mix Engine</h2>
            <div class="search-container">
                <label>Multi-Target Code Search Engine (Searching clears default pre-filters):</label>
                <input type="text" id="dropbox-search" class="search-bar" oninput="filterData('dropbox')" placeholder="Type to filter specific records (e.g. MGM01, RS042)...">
                
                <label style="margin-top: 5px;">Active Category Filters:</label>
                <div class="badge-container">
                    <div class="filter-badge" data-value="NGS" id="badge-NGS" onclick="toggleBadge(this)">NGS</div>
                    <div class="filter-badge" data-value="HISTO" id="badge-HISTO" onclick="toggleBadge(this)">HISTO</div>
                    <div class="filter-badge" data-value="FISH" id="badge-FISH" onclick="toggleBadge(this)">FISH</div>
                    <div class="filter-badge" data-value="IHC" id="badge-IHC" onclick="toggleBadge(this)">IHC</div>
                </div>
                <div class="meta-info" id="dropbox-count">Showing pre-filtered core categories...</div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Test Code</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-dropbox">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // Suppress unhandled execution events cleanly
    window.onerror = function (msg, url, line) {
        console.warn("Muted exception trace captured safely:", msg, "at line", line);
        return true; 
    };

    const SUPABASE_URL = 'https://sgqhyawfunxuiggmharb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_jC9bsUEnb9uyA24P5oalvw_Ik8MwB6q';
    
    let client;
    try {
        const targetSupabase = window.supabase ? window.supabase : (typeof supabase !== 'undefined' ? supabase : null);
        if (targetSupabase) {
            client = targetSupabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(e) {
        console.error("Initialization Failed", e);
    }

    let MASTER_DATA = [];
    // Automatically pre-load the 4 standard medical categories on initiation
    let selectedBadges = ["NGS", "HISTO", "FISH", "IHC"];

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        document.getElementById(`page-${pageId}`).classList.add('active');
        document.getElementById(`nav-${pageId}`).classList.add('active');

        if (pageId === 'dropbox') {
            // Re-apply default filters on fresh navigation visits if search input is empty
            if (document.getElementById('dropbox-search').value.trim() === "") {
                selectedBadges = ["NGS", "HISTO", "FISH", "IHC"];
                syncBadgeUI();
            }
        }

        if((pageId === 'dashboard' || pageId === 'dropbox') && client) {
            fetchRecords();
        }
    }

    function syncBadgeUI() {
        document.querySelectorAll('.filter-badge').forEach(badge => {
            const val = badge.getAttribute('data-value');
            if (selectedBadges.includes(val)) {
                badge.classList.add('selected');
            } else {
                badge.classList.remove('selected');
            }
        });
    }

    // Comprehensive Natural Alphanumeric Sorting
    function naturalSort(a, b) {
        let valA = (a && a.Test_code) ? String(a.Test_code).trim() : '';
        let valB = (b && b.Test_code) ? String(b.Test_code).trim() : '';
        return valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });
    }

    async function fetchRecords() {
        if(!client) return;
        const { data, error } = await client.from('Test_records').select('*');
        if (error) {
            console.error(error);
            return;
        }
        
        MASTER_DATA = data ? data.sort(naturalSort) : [];
        
        // Initial interface fill
        syncBadgeUI();
        filterData('dashboard');
        filterData('dropbox');
    }

    function filterData(mode) {
        let rawInput = document.getElementById(mode === 'dashboard' ? 'db-search' : 'dropbox-search').value.toLowerCase().trim();
        let targetBody = document.getElementById(mode === 'dashboard' ? 'table-body-dashboard' : 'table-body-dropbox');
        
        // Split complex parameters dynamically using both commas and ampersands seamlessly
        let searchQueries = rawInput.split(/[,&]+/).map(q => q.trim()).filter(q => q.length > 0);

        // DropBox Specific Rule: If a user begins typing in the search bar, ignore the default pre-filters
        let activeBadges = selectedBadges;
        if (mode === 'dropbox' && searchQueries.length > 0) {
            activeBadges = []; 
        }

        let filtered = MASTER_DATA.filter(row => {
            if (!row) return false;

            // Strict focus targeting ONLY the Test_code column
            let code = (row.Test_code !== null && row.Test_code !== undefined) ? String(row.Test_code).toLowerCase().trim() : '';
            let cat = (row.Category !== null && row.Category !== undefined) ? String(row.Category).toUpperCase().trim() : '';

            if (code === 'null') code = '';

            // 1. Evaluate Code Column matching rule
            let matchesSearch = true;
            if (searchQueries.length > 0) {
                matchesSearch = searchQueries.some(query => code.includes(query));
            }

            // 2. Evaluate Combo Category Badges Filter
            let matchesBadges = true;
            if (mode === 'dropbox' && activeBadges.length > 0) {
                matchesBadges = activeBadges.some(b => cat === b.toUpperCase());
            }

            return matchesSearch && matchesBadges;
        });

        // Write resulting lines into safe view grid rows
        targetBody.innerHTML = filtered.map(row => {
            if(!row) return '';
            let dispCode = row.Test_code && String(row.Test_code) !== 'null' ? String(row.Test_code).toUpperCase() : '';
            let dispCat = row.Category && String(row.Category) !== 'null' ? String(row.Category).toUpperCase() : '<span style="color:#aaa">NONE</span>';
            let dispStatus = row.status && String(row.status) !== 'null' ? String(row.status).toUpperCase() : 'UNKNOWN';
            let dispComments = row.Comments && String(row.Comments) !== 'null' ? row.Comments : '';

            return `
                <tr>
                    <td><b>${dispCode}</b></td>
                    <td>${dispCat}</td>
                    <td>
                        <span class="status-badge ${dispStatus === 'NORMAL' ? 'status-normal' : 'status-notnormal'}">
                            ${dispStatus}
                        </span>
                    </td>
                    <td>${dispComments}</td>
                </tr>
            `;
        }).join('');

        document.getElementById(`${mode}-count`).innerText = `Found ${filtered.length} matching record entries sequentially sorted.`;
    }

    function toggleBadge(element) {
        const val = element.getAttribute('data-value');
        
        // Clear input bar if a user intentionally interacts with filters directly
        document.getElementById('dropbox-search').value = "";

        if(selectedBadges.includes(val)) {
            selectedBadges = selectedBadges.filter(v => v !== val);
            element.classList.remove('selected');
        } else {
            selectedBadges.push(val);
            element.classList.add('selected');
        }
        filterData('dropbox');
    }

    document.getElementById('mgmForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!client) { alert("Database connection offline."); return; }
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Registering Entry...";
        btn.disabled = true;

        // Extract inputs applying forced systemic upper-casing logic
        const testCode = document.getElementById('testCode').value.trim().toUpperCase();
        const category = document.getElementById('category').value.trim().toUpperCase();
        const status = document.getElementById('status').value.toUpperCase();
        const comments = document.getElementById('comments').value.trim(); // Stays normal case

        const { error } = await client.from('Test_records').insert([
            { 'Test_code': testCode, 'Category': category, 'status': status, 'Comments': comments }
        ]);

        if (error) {
            alert('Database Registry Fault: ' + error.message);
        } else {
            alert('New medical code parameters mapped successfully!');
            document.getElementById('mgmForm').reset();
            switchPage('dashboard');
        }
        btn.innerText = "Register Code Data";
        btn.disabled = false;
    });

    window.onload = () => {
        if(client) fetchRecords();
    };
</script>

</body>
</html>
