<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Records Master Dashboard</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2.43.4/dist/umd/supabase.js"></script>
    <style>
        :root {
            --primary: #3ecf8e;
            --primary-hover: #34b279;
            --bg: #f4f4f9;
            --dark: #2c3e50;
        }
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: var(--bg); color: var(--dark); }
        
        /* Navigation Bar */
        nav { background-color: white; padding: 15px 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; gap: 15px; position: sticky; top: 0; z-index: 100; }
        nav button { padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: all 0.2s; background: #e0e0e0; color: var(--dark); }
        nav button.active { background-color: var(--primary); color: white; }
        
        /* Main Container */
        .container { max-width: 1100px; margin: 30px auto; padding: 20px; }
        .page { display: none; }
        .page.active { display: block; }
        
        /* Card Layouts */
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { margin-top: 0; color: var(--dark); border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        
        /* Form Styling */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .submit-btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .submit-btn:hover { background: var(--primary-hover); }

        /* Search Controls */
        .search-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        .search-bar { font-size: 15px; padding: 12px; border: 2px solid #ddd; border-radius: 6px; }
        .search-bar:focus { border-color: var(--primary); outline: none; }
        .badge-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .filter-badge { padding: 8px 16px; background: #e0e0e0; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; user-select: none; }
        .filter-badge.selected { background: var(--dark); color: white; }

        /* Real Data Table Layout */
        .table-responsive { overflow-x: auto; background: white; border-radius: 8px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px 15px; border-bottom: 1px solid #eee; font-size: 14px; }
        th { background-color: #fafafa; font-weight: bold; color: #666; }
        tr:hover { background-color: #fafdff; }
        
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; display: inline-block; }
        .status-normal { background-color: #e6f9f0; color: #1f925b; }
        .status-notnormal { background-color: #feecee; color: #eb3b5a; }
        
        .meta-info { font-size: 13px; color: #666; margin-bottom: 10px; font-style: italic; }
    </style>
</head>
<body>

<nav>
    <button id="nav-dashboard" class="active" onclick="switchPage('dashboard')">📊 Dashboard Dashboard</button>
    <button id="nav-add" onclick="switchPage('add')">➕ Add Entry</button>
    <button id="nav-dropbox" onclick="switchPage('dropbox')">📥 DropBox Filters</button>
</nav>

<div class="container">

    <div id="page-dashboard" class="page active">
        <div class="card">
            <h2>All System Records</h2>
            <div class="search-container">
                <input type="text" id="db-search" class="search-bar" oninput="filterData('dashboard')" placeholder="Search codes separated by commas (e.g. MGM005, RS042, MGM044)...">
                <div class="meta-info" id="db-count">Loading entries...</div>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Gym Test Code</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-dashboard">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="page-add" class="page">
        <div class="card" style="max-width: 500px; margin: auto;">
            <h2>Create Gym Entry</h2>
            <form id="gymForm">
                <div class="form-group">
                    <label for="gymCode">Gym Test Code</label>
                    <input type="text" id="gymCode" required placeholder="Type code here (e.g. MGM042 or RS042)">
                </div>
                
                <div class="form-group">
                    <label for="category">Category</label>
                    <input type="text" id="category" required placeholder="e.g. NGS, HISTO, FISH, IHC">
                </div>
                
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="Normal">Normal</option>
                        <option value="Not Normal">Not Normal</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="comments">Comments</label>
                    <textarea id="comments" rows="4" placeholder="Add custom diagnostic notes..."></textarea>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn">Submit Data</button>
            </form>
        </div>
    </div>

    <div id="page-dropbox" class="page">
        <div class="card">
            <h2>DropBox Advanced Category Mix Engine</h2>
            <div class="search-container">
                <label>Multi-Target Code Search Bar (Comma-separated matches strictly on codes):</label>
                <input type="text" id="dropbox-search" class="search-bar" oninput="filterData('dropbox')" placeholder="e.g. MGM01, RS042...">
                
                <label style="margin-top: 5px;">Combo Pre-Filters (Select one or toggle multiple to mix):</label>
                <div class="badge-container">
                    <div class="filter-badge" data-value="NGS" onclick="toggleBadge(this)">NGS</div>
                    <div class="filter-badge" data-value="HISTO" onclick="toggleBadge(this)">HISTO</div>
                    <div class="filter-badge" data-value="FISH" onclick="toggleBadge(this)">FISH</div>
                    <div class="filter-badge" data-value="IHC" onclick="toggleBadge(this)">IHC</div>
                </div>
                <div class="meta-info" id="dropbox-count">Showing filtered records...</div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Gym Test Code</th>
                            <th>Category</th>
                            <th>Status</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="table-body-dropbox">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<script>
    // Silently handle runtime exceptions so the UI never locks up
    window.onerror = function (msg, url, line) {
        console.warn("Caught suppressed event stream error:", msg, "at line", line);
        return true; 
    };

    const SUPABASE_URL = 'https://sgqhyawfunxuiggmharb.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_jC9bsUEnb9uyA24P5oalvw_Ik8MwB6q';
    
    let client;
    try {
        const targetSupabase = window.supabase ? window.supabase : (typeof supabase !== 'undefined' ? supabase : null);
        if (targetSupabase) {
            client = targetSupabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }
    } catch(e) {
        console.error("Initialization Failed", e);
    }

    let MASTER_DATA = [];
    let selectedBadges = [];

    function switchPage(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        
        document.getElementById(`page-${pageId}`).classList.add('active');
        document.getElementById(`nav-${pageId}`).classList.add('active');

        if((pageId === 'dashboard' || pageId === 'dropbox') && client) {
            fetchRecords();
        }
    }

    // Comprehensive Alphanumeric Sorting (Handles both MGM and RS code series sorted cleanly)
    function naturalSort(a, b) {
        let valA = (a && a.Test_code) ? String(a.Test_code).trim() : '';
        let valB = (b && b.Test_code) ? String(b.Test_code).trim() : '';
        return valA.localeCompare(valB, undefined, { numeric: true, sensitivity: 'base' });
    }

    async function fetchRecords() {
        if(!client) return;
        const { data, error } = await client.from('Test_records').select('*');
        if (error) {
            console.error(error);
            return;
        }
        
        MASTER_DATA = data ? data.sort(naturalSort) : [];
        
        filterData('dashboard');
        filterData('dropbox');
    }

    function filterData(mode) {
        let searchInput = document.getElementById(mode === 'dashboard' ? 'db-search' : 'dropbox-search').value.toLowerCase().trim();
        let targetBody = document.getElementById(mode === 'dashboard' ? 'table-body-dashboard' : 'table-body-dropbox');
        
        // Split values safely using comma delimiters
        let searchQueries = searchInput.split(',').map(q => q.trim()).filter(q => q.length > 0);

        let filtered = MASTER_DATA.filter(row => {
            if (!row) return false;

            // TARGET LOCK: Search logic looks ONLY at the Test_code column
            let code = (row.Test_code !== null && row.Test_code !== undefined) ? String(row.Test_code).toLowerCase().trim() : '';
            let cat = (row.Category !== null && row.Category !== undefined) ? String(row.Category).toLowerCase().trim() : '';

            if (code === 'null') code = '';
            if (cat === 'null') cat = '';

            // 1. Code Column Only Search Rule
            let matchesSearch = true;
            if (searchQueries.length > 0) {
                matchesSearch = searchQueries.some(query => code.includes(query));
            }

            // 2. DropBox Pre-Filter Combos Matching Layout
            let matchesBadges = true;
            if (mode === 'dropbox' && selectedBadges.length > 0) {
                matchesBadges = selectedBadges.some(b => cat === b.toLowerCase());
            }

            return matchesSearch && matchesBadges;
        });

        // Safe Dynamic Layout Rendering Assembly
        targetBody.innerHTML = filtered.map(row => {
            if(!row) return '';
            let dispCode = row.Test_code && String(row.Test_code) !== 'null' ? row.Test_code : '';
            let dispCat = row.Category && String(row.Category) !== 'null' ? row.Category : '<span style="color:#aaa">None</span>';
            let dispStatus = row.status && String(row.status) !== 'null' ? row.status : 'Unknown';
            let dispComments = row.Comments && String(row.Comments) !== 'null' ? row.Comments : '';

            return `
                <tr>
                    <td><b>${dispCode}</b></td>
                    <td>${dispCat}</td>
                    <td>
                        <span class="status-badge ${dispStatus === 'Normal' ? 'status-normal' : 'status-notnormal'}">
                            ${dispStatus}
                        </span>
                    </td>
                    <td>${dispComments}</td>
                </tr>
            `;
        }).join('');

        document.getElementById(`${mode}-count`).innerText = `Found ${filtered.length} total entries matched.`;
    }

    function toggleBadge(element) {
        const val = element.getAttribute('data-value');
        if(selectedBadges.includes(val)) {
            selectedBadges = selectedBadges.filter(v => v !== val);
            element.classList.remove('selected');
        } else {
            selectedBadges.push(val);
            element.classList.add('selected');
        }
        filterData('dropbox');
    }

    document.getElementById('gymForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if(!client) { alert("Database connection unavailable."); return; }
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = "Processing...";
        btn.disabled = true;

        const gymCode = document.getElementById('gymCode').value.trim();
        const category = document.getElementById('category').value.trim();
        const status = document.getElementById('status').value;
        const comments = document.getElementById('comments').value.trim();

        const { error } = await client.from('Test_records').insert([
            { 'Test_code': gymCode, 'Category': category, 'status': status, 'Comments': comments }
        ]);

        if (error) {
            alert('Database Submission Error: ' + error.message);
        } else {
            alert('Data saved perfectly into live database records!');
            document.getElementById('gymForm').reset();
            switchPage('dashboard');
        }
        btn.innerText = "Submit Data";
        btn.disabled = false;
    });

    window.onload = () => {
        if(client) fetchRecords();
    };
</script>

</body>
</html>
